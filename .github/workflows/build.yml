name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version
        id: ver
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Lint the app
        run: |
          node --check app/app.js
          node --check app/config.js
          node --check tools/app-test.cjs

      - name: Test the app (headless Chromium, fake RomM server)
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node tools/app-test.cjs

      - name: Build .wgt
        env:
          TIZEN_AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12 }}
          TIZEN_AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          TIZEN_DISTRIBUTOR_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12 }}
          TIZEN_DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: |
          npm install --no-save --prefix /tmp/tizenjs github:reisxd/tizen.js
          TIZENJS=/tmp/tizenjs/node_modules/tizen/cli.js

          SIGN_ARGS=""
          if [ -n "$TIZEN_AUTHOR_P12" ]; then
            echo "$TIZEN_AUTHOR_P12" | base64 -d > /tmp/author.p12
            PASS="$TIZEN_AUTHOR_PASSWORD"
            SIGN_ARGS="--author /tmp/author.p12 --authorPwd $PASS"
            if [ -n "$TIZEN_DISTRIBUTOR_P12" ]; then
              echo "$TIZEN_DISTRIBUTOR_P12" | base64 -d > /tmp/distributor.p12
              SIGN_ARGS="$SIGN_ARGS --distributor /tmp/distributor.p12 --distributorPwd $TIZEN_DISTRIBUTOR_PASSWORD"
            else
              echo "::warning::no distributor certificate, the TV will reject this build"
              SIGN_ARGS="$SIGN_ARGS -p public"
            fi
          else
            echo "::error::TIZEN_AUTHOR_P12 not set; a self-signed build cannot be installed on a TV"
            echo "::error::run tools/tv-setup.sh once to create a Samsung certificate, then add it as secrets"
            PASS=throwaway
            node "$TIZENJS" create-tizen-cert --name romm-tizen --password "$PASS" --output /tmp/author.p12
            SIGN_ARGS="--author /tmp/author.p12 --authorPwd $PASS -p public"
          fi

          rm -rf wgt
          mkdir -p wgt
          cp -r app/. wgt/
          sed "s/@VERSION@/${{ steps.ver.outputs.version }}/" tizen/config.xml > wgt/config.xml

          cd wgt
          node "$TIZENJS" build . -t wgt -o ../RomM.wgt $SIGN_ARGS
          cd ..
          unzip -l RomM.wgt

      - uses: actions/upload-artifact@v4
        with:
          name: RomM-wgt
          path: RomM.wgt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" RomM.wgt \
            --title "RomM for Tizen ${GITHUB_REF_NAME}" \
            --notes "RomM web UI and browser player packaged for Samsung Tizen TVs."
